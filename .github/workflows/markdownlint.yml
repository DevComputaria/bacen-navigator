# Lint Markdown files
name: Markdown Lint

on:
  push:
    branches: ["main"]
    paths:
      - '**/*.md'
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          # `docs/` contém texto jurídico gerado automaticamente pelo BCB.
          # O conteúdo-fonte não deve ser reformatado como Markdown editorial.
          globs: |
            **/*.md
            #docs/**
