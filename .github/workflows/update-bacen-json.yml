name: Update Bacen JSON

on:
  workflow_run:
    workflows: ["Update Bacen Feed"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bacen-json
  cancel-in-progress: false

jobs:
  convert:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert feeds to JSON
        run: |
          python3 scripts/convert_bacen_feed.py \
            --year 2026 \
            --input-dir docs/feed/2026 \
            --output src/normativas_2026.json

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/normativas_2026.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update 2026 Bacen JSON"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
