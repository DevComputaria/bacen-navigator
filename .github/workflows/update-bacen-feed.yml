name: Update Bacen Data

on:
  schedule:
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Reextrair todas as normativas de 2026
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-bacen-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Bacen feed
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.bcb.gov.br/api/feed/app/normativos/normativos?ano=2026"
          OUTPUT_DIR="docs/feed/2026"
          mkdir -p "$OUTPUT_DIR"
          timestamp=$(date -u '+%Y%m%d-%H%M%S')
          output_file="$OUTPUT_DIR/feed-$timestamp.xml"
          curl --fail --location --retry 3 --retry-all-errors "$URL" --output "$output_file"
          python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$output_file"
          echo "FEED_FILE=$output_file" >> "$GITHUB_ENV"

      - name: Update consolidated JSON
        run: |
          python3 scripts/convert_bacen_feed.py \
            --year 2026 \
            --input-dir docs/feed/2026 \
            --output src/normativas_2026.json

      - name: Extract and revalidate normative texts
        shell: bash
        env:
          FORCE_EXTRACTION: ${{ inputs.force || 'false' }}
        run: |
          args=(
            src/normativas_2025.json
            src/normativas_2026.json
            --output-dir docs
            --refresh-days 45
          )
          if [[ "$FORCE_EXTRACTION" == "true" ]]; then
            args+=(--force)
          fi
          python3 scripts/extract_bacen_texts.py "${args[@]}"

      - name: Validate generated data
        run: |
          python3 scripts/validate_bacen_data.py \
            src/normativas_2025.json \
            src/normativas_2026.json \
            --feed-dir docs/feed/2026 \
            --docs-dir docs

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FEED_FILE" src/normativas_2026.json docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update Bacen data"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
